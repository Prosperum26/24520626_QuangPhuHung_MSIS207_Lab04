# MongoDB cho Homework 1. Chạy: docker compose up -d (trong Homework1_Lab04/).
services:
  mongo:
    image: mongo:8.0
    container_name: msis207-lab04-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
    name: msis207-lab04-mongo-data
    external: false
